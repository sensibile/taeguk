name: Codex review gate
# Publishes the `codex-review` commit status from Codex's PR summary comment and
# enables squash auto-merge once that review covers the head commit.
#
# Both triggers run the default branch's workflow and gate script, never PR
# code, so a PR cannot change how its own review is judged. Codex's review
# result reaches the gate as an edit of its summary comment.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  issue_comment:
    types: [created, edited, deleted]
permissions: {}
jobs:
  gate:
    # Only same-repository PRs, and only comments written by the Codex app.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    # Job-level so filtered-out events never join, and never cancel, a running gate.
    concurrency:
      group: codex-review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # A deleted Codex summary or a retargeted base voids the earlier review.
          INVALIDATE: >-
            ${{ (github.event_name == 'issue_comment' && github.event.action == 'deleted' && contains(github.event.comment.body, 'codex-pull-request-review-summary')) ||
            (github.event_name == 'pull_request_target' && github.event.action == 'edited' && github.event.changes.base != null) }}
        # Every event re-checks the review request: a queued run can be replaced by a later event.
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --request-review --auto-merge)
          if [ "$INVALIDATE" = true ]; then args+=(--invalidate); fi
          python3 scripts/codex_review_gate.py "${args[@]}"
