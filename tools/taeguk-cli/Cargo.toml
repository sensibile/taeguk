[package]
name = "taeguk-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "taeguk"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2.190"
proc-macro2 = { version = "1.0.107", default-features = false }
syn = { version = "3.0.7", default-features = false, features = ["full", "parsing", "visit"] }
ureq = { version = "3", default-features = false, features = ["json"] }
